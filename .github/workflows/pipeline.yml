name: CI/CD DevOps Pipeline Avanzado

on:
  push:
    branches: [ "main" ]


permissions:
  contents: read
  packages: write

jobs:
  construccion-pruebas-y-publicacion:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Clonar el repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8  # Instalamos el evaluador de calidad de código

    - name: 4. Análisis de Calidad de Código (Linter)
      run: |
        # Revisa que el código cumpla con los estándares profesionales (PEP 8)
        flake8 app.py test_app.py --max-line-length=120

    - name: 5. Ejecutar Pruebas Unitarias (PyTest)
      run: |
        python -m pytest test_app.py

    - name: 6. Probar Orquestación (Docker Compose)
      run: |
        docker compose up -d
        docker compose down

    - name: 7. Iniciar sesión en GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} # GitHub nos da esta contraseña automáticamente

    - name: 8. Construir y Publicar Imagen Docker en la Nube
      run: |
        # Convertimos  nombre de usuario a minúsculas 
        IMAGE_ID=ghcr.io/${{ github.repository_owner }}/api-pasteleria-devops
        IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
        
        docker build -t $IMAGE_ID:latest .
        docker push $IMAGE_ID:latest