name: CI/CD DevOps Pipeline

# Esto le dice a GitHub que ejecute el pipeline cuando subas código a la rama 'main'
on:
  push:
    branches: [ "main" ]

jobs:
  construccion-y-pruebas:
    # El servidor virtual que nos presta GitHub para trabajar
    runs-on: ubuntu-latest

    steps:
    - name: 1. Clonar el repositorio
      uses: actions/checkout@v3

    - name: 2. Configurar Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Ejecutar Pruebas Unitarias (PyTest)
      run: |
        pytest test_app.py

    - name: 5. Construir Contenedor Docker
      run: |
        docker build -t api-pasteleria-devops:latest .

    - name: 6. Probar Orquestación (Docker Compose)
      run: |
        docker-compose up -d
        docker-compose down