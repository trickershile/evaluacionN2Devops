name: CI/CD DevOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  construccion-y-pruebas:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Clonar el repositorio
      uses: actions/checkout@v4  # Actualizado a v4 para quitar la advertencia amarilla

    - name: 2. Configurar Python 3.9
      uses: actions/setup-python@v5 # Actualizado a v5
      with:
        python-version: "3.9"

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Ejecutar Pruebas Unitarias (PyTest)
      run: |
        python -m pytest test_app.py  # Llamamos a pytest a través de python para evitar el error 127

    - name: 5. Construir Contenedor Docker
      run: |
        docker build -t api-pasteleria-devops:latest .

    - name: 6. Probar Orquestación (Docker Compose)
      run: |
        docker compose up -d  # Quitamos el guion (ahora es "docker compose")
        docker compose down