name: CI/CD DevOps Pipeline Avanzado con Observabilidad

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ] # Necesario para las Branch Protection Rules (IE5)

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # JOB 1: VALIDACIÓN DE CALIDAD Y PRUEBAS (CI)
  # ==========================================
  pruebas-y-calidad:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Clonar el repositorio
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: 2. Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov flake8

    - name: 4. Ejecutar Pruebas Unitarias con Reporte de Cobertura (IE3)
      run: |
        # Generamos un reporte xml de cobertura para que SonarCloud lo use en el Dashboard
        python -m pytest --cov=. --cov-report=xml test_app.py

    - name: 5. Análisis de Seguridad y Código con SonarCloud (IE5 y Mecanismo de Parada IE6)
      uses: SonarSource/sonarcloud-github-action@v5.0.0
      with:
        args: >
          -Dsonar.qualitygate.wait=true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ==========================================
  # JOB 2: EMPAQUETADO Y EMISIÓN DE IMAGEN DOCKER
  # ==========================================
  publicacion-imagen:
    needs: pruebas-y-calidad # SÓLO se ejecuta si pasó el Quality Gate de Sonar (IE6)
    runs-on: ubuntu-latest
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Probar Orquestación Local (Docker Compose)
      run: |
        docker compose up -d
        docker compose down

    - name: Iniciar sesión en GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Construir y Publicar Imagen Docker
      run: |
        IMAGE_ID=ghcr.io/${{ github.repository_owner }}/api-pasteleria-devops
        IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
        docker build -t $IMAGE_ID:latest .
        docker push $IMAGE_ID:latest

  # ==========================================
  # JOB 3: DESPLIEGUE AUTOMATIZADO Y OBSERVABILIDAD (CD)
  # ==========================================
  despliegue-kubernetes:
    needs: publicacion-imagen
    runs-on: ubuntu-latest
    steps:
    - name: 1. Clonar el repositorio
      uses: actions/checkout@v4

    # SOLUCIÓN DE ENTORNO SIMULADO: Crea un cluster de K8s real efímero dentro de GitHub Actions (No necesita secrets)
    - name: 2. Levantar Clúster Kubernetes Local (Kind)
      uses: helm/kind-action@v1.8.0
      with:
        cluster_name: cluster-pasteleria

    - name: 3. Aplicar Manifiestos de Kubernetes con Anotaciones de Monitoreo (IE2)
      run: |
        # Aplicamos de forma automatizada los manifiestos que exponen las métricas a Prometheus
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml

    - name: 4. Verificar Estado del Despliegue en el Entorno
      run: |
        kubectl get deployments -n default
        kubectl get services -n default